<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, height=630, initial-scale=1.0" />
  <title>Ruhani OG Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #030504;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 80% 80%, rgba(217, 119, 6, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(5, 150, 105, 0.08) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Double hairline borders */
    .border-outer {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      pointer-events: none;
    }
    .border-inner {
      position: absolute;
      inset: 32px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 14px;
      pointer-events: none;
    }

    /* Corner ornamental brackets */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #d4af37;
      border-style: solid;
      opacity: 0.8;
    }
    .corner-tl { top: 38px; left: 38px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 38px; right: 38px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 38px; left: 38px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 38px; right: 38px; border-width: 0 2px 2px 0; }

    /* Central 8-Point Islamic Star Rosette Watermark */
    .watermark-rosette {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 580px;
      opacity: 0.06;
      pointer-events: none;
    }

    .content-box {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 960px;
    }

    /* Top Emblem */
    .emblem-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .hairline-flourish {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
    }
    .emblem-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fcd34d;
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }

    /* Master Calligraphy */
    .calligraphy {
      font-family: 'Amiri', serif;
      font-size: 102px;
      line-height: 1.1;
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 0%, #fef3c7 40%, #f59e0b 85%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(245, 158, 11, 0.28));
      margin-bottom: 4px;
    }

    /* English Logotype */
    .brand-en {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      letter-spacing: 0.38em;
      color: #e5e7eb;
      font-weight: 700;
      margin-bottom: 16px;
      margin-right: -0.38em;
      opacity: 0.95;
    }

    /* Tagline */
    .editorial-tagline {
      font-size: 19px;
      color: #9ca3af;
      max-width: 760px;
      line-height: 1.6;
      margin-bottom: 34px;
      font-weight: 400;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .editorial-tagline strong {
      color: #34d399;
      font-weight: 600;
    }

    /* Badges Row */
    .features-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      color: #d1d5db;
      font-weight: 500;
      backdrop-filter: blur(8px);
    }
    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Islamic 8-Point Rosette SVG Watermark -->
  <svg class="watermark-rosette" viewBox="0 0 200 200" fill="none" stroke="#d4af37" stroke-width="1.2">
    <rect x="35" y="35" width="130" height="130" transform="rotate(0 100 100)" />
    <rect x="35" y="35" width="130" height="130" transform="rotate(45 100 100)" />
    <circle cx="100" cy="100" r="75" stroke-dasharray="2 3" />
    <circle cx="100" cy="100" r="50" />
    <circle cx="100" cy="100" r="25" />
    <polygon points="100,10 115,70 175,70 125,105 145,165 100,130 55,165 75,105 25,70 85,70" stroke-width="0.8" />
  </svg>

  <div class="content-box">
    <div class="emblem-wrapper">
      <div class="hairline-flourish"></div>
      <div class="emblem-badge">
        <span>✦</span>
        <span>الملاذ الرقمي لتلاوة القرآن والذكر</span>
        <span>✦</span>
      </div>
      <div class="hairline-flourish"></div>
    </div>

    <div class="calligraphy">رُوحَانِي</div>
    <div class="brand-en">RUHANI</div>

    <p class="editorial-tagline">
      A pristine spiritual sanctuary for reciting the <strong>Holy Quran</strong>, listening to timeless masters, tracking daily prayers, and quiet contemplation.
    </p>

    <div class="features-row">
      <div class="pill">
        <span class="pill-dot"></span>
        <span>المصحف الشريف الملون</span>
      </div>
      <div class="pill">
        <span class="pill-dot"></span>
        <span>١٥ من كبار القراء</span>
      </div>
      <div class="pill">
        <span class="pill-dot"></span>
        <span>مواقيت الصلاة والقبلة</span>
      </div>
      <div class="pill">
        <span class="pill-dot"></span>
        <span>متابعة الختمة والأذكار</span>
      </div>
    </div>
  </div>
</body>
</html>
